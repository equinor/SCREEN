[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonpickle>=4.1.1",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "resdata>=6.2.4",
    "scipy>=1.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ipympl==0.9.3",
    "jupyter==1.0.0",
    "jupyter-dash==0.4.2",
    "jupyterlab==4.3.8",
]
docs = [
    "markdown-callouts==0.3.0",
    "mkdocs==1.5.3",
    "mkdocs-autorefs==0.5.0",
    "mkdocs-material==9.4.14",
    "mkdocstrings[python]==0.24.0",
]
test = ["pytest==7.4.3", "pytest-cov==4.1.0", "ruff==0.5.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
