name: SCREEN-docs
on:

  pull_request:
    branches:
    - main

  push:
    branches: 
    - main
    - gpb/dev

  workflow_dispatch:
    branches:
    - main
    - gpb/dev


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install uv (recommended by Astral + fastest method)
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # Sync environment strictly from uv.lock (no resolver)
      - name: Sync dependencies
        run: uv sync --locked

      - name: Build & deploy docs
        run: uv run mkdocs gh-deploy --force
