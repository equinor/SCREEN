name: SCREEN-unittest

on:

  pull_request:
    branches:
    - main

  push:
    branches: 
    - main
    - gpb/dev

  workflow_dispatch:
    branches:
    - main
    - gpb/dev


permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Sync environment for Python ${{ matrix.python-version }}
        run: |
          uv sync --python ${{ matrix.python-version }}
          uv pip install pytest pytest-cov

      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest --cov tests

