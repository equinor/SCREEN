name: SCREEN-lint

on:

  pull_request:
    branches:
    - main

  push:
    branches: 
    - main
    - gpb/dev

  workflow_dispatch:
    branches:
    - main
    - gpb/dev


permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4

      # Install uv (fast Python toolchain & package manager)
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Lint with Ruff
        run: uv run --only-group test ruff check --output-format=github .
